name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, format, type-check, test, compile
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history required so the migration-safety gate below can
          # diff against origin/main (spec 005-enterprise-platform §17,
          # Wave 4, FR-DEPLOY-005) — a shallow clone has no base ref to
          # diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: mypy type check
        run: mypy src

      - name: pytest (unit + provider conformance — no external infrastructure required)
        run: pytest tests/unit tests/providers -q

      - name: Byte-compile source, migrations, and tests
        run: python -m compileall -q src migrations tests

      - name: Migration safety gate — block unreviewed destructive migrations
        run: python scripts/check_destructive_migrations.py --base origin/main

  frontend:
    name: Frontend — lint, type-check, test, Storybook (a11y gate), build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier format check
        working-directory: frontend
        run: npm run format:check

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit + component tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Storybook tests (includes the a11y hard gate — see .storybook/preview.tsx)
        working-directory: frontend
        run: npm run test:storybook

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: End-to-end tests (Playwright)
        working-directory: frontend
        run: npm run test:e2e
